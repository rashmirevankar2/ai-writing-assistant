<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quill — AI Writing Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1814;
      --ink-muted: #6b6760;
      --ink-faint: #b0ada8;
      --paper: #faf8f5;
      --paper-warm: #f2ede6;
      --paper-card: #ffffff;
      --accent: #c8773a;
      --accent-light: #f0dece;
      --border: #e2ddd7;
      --shadow: 0 2px 16px rgba(26,24,20,0.08);
      --radius: 12px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 2rem 2rem 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      background: var(--paper-card);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.02em;
    }

    .logo span {
      color: var(--accent);
      font-style: italic;
    }

    .tagline {
      font-size: 0.8rem;
      color: var(--ink-faint);
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Main layout */
    main {
      flex: 1;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    /* Mode selector */
    .modes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--paper-card);
      color: var(--ink-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mode-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .mode-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .mode-btn .icon { font-size: 14px; }

    /* Editor area */
    .editor-wrap {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .editor-label {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-faint);
      border-bottom: 1px solid var(--border);
      background: var(--paper-warm);
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 20px;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.8;
      color: var(--ink);
      background: transparent;
      border: none;
      outline: none;
      resize: vertical;
    }

    textarea::placeholder { color: var(--ink-faint); font-style: italic; }

    .editor-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--paper-warm);
    }

    .char-count { font-size: 12px; color: var(--ink-faint); }

    /* Run button */
    .run-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      background: var(--ink);
      color: var(--paper);
      border: none;
      border-radius: 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.01em;
    }

    .run-btn:hover { background: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(200,119,58,0.3); }
    .run-btn:active { transform: translateY(0); }
    .run-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Output */
    .output-card {
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--accent-light);
    }

    .output-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .output-actions { display: flex; gap: 8px; }

    .action-btn {
      padding: 5px 14px;
      border-radius: 40px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover { background: var(--accent); color: white; }

    .output-text {
      padding: 20px;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      line-height: 1.8;
      color: var(--ink);
      white-space: pre-wrap;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 2.5rem;
      background: var(--paper-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .loading-quill {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2rem;
      animation: float 1.2s ease-in-out infinite alternate;
      display: inline-block;
    }

    @keyframes float {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-6px) rotate(3deg); }
    }

    .loading p {
      margin-top: 12px;
      font-size: 13px;
      color: var(--ink-faint);
      font-style: italic;
    }

    /* Error */
    .error-msg {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: #fff5f5;
      border: 1px solid #fcc;
      color: #c0392b;
      font-size: 13px;
      margin-top: 1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 12px;
      color: var(--ink-faint);
      border-top: 1px solid var(--border);
    }

    footer a { color: var(--accent); text-decoration: none; }

    @media (max-width: 600px) {
      header { padding: 1.25rem; }
      main { padding: 1.5rem 1rem; }
      .logo { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Qu<span>i</span>ll</div>
  <div class="tagline">AI Writing Assistant</div>
</header>

<main>

  <div class="modes">
    <button class="mode-btn active" onclick="setMode('improve', this)"><span class="icon">✦</span> Improve</button>
    <button class="mode-btn" onclick="setMode('rewrite', this)"><span class="icon">↺</span> Rewrite</button>
    <button class="mode-btn" onclick="setMode('formal', this)"><span class="icon">🎩</span> Make Formal</button>
    <button class="mode-btn" onclick="setMode('casual', this)"><span class="icon">😊</span> Make Casual</button>
    <button class="mode-btn" onclick="setMode('shorter', this)"><span class="icon">✂</span> Shorten</button>
    <button class="mode-btn" onclick="setMode('expand', this)"><span class="icon">⟷</span> Expand</button>
  </div>

  <div class="editor-wrap">
    <div class="editor-label">Your text</div>
    <textarea id="input-text" placeholder="Paste or type your text here…"></textarea>
    <div class="editor-footer">
      <span class="char-count" id="char-count">0 characters</span>
      <button class="run-btn" id="run-btn" onclick="runAssistant()">
        <span>✦</span> Transform
      </button>
    </div>
  </div>

  <div id="output-area"></div>

</main>

<footer>
  Powered by <a href="https://anthropic.com" target="_blank">Claude AI</a> · Built with Quill
</footer>

<script>
  let currentMode = 'improve';

  const modeLabels = {
    improve: 'Improved version',
    rewrite: 'Rewritten version',
    formal: 'Formal version',
    casual: 'Casual version',
    shorter: 'Shortened version',
    expand: 'Expanded version',
  };

  function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  document.getElementById('input-text').addEventListener('input', function () {
    document.getElementById('char-count').textContent = this.value.length + ' characters';
  });

  function showLoading() {
    document.getElementById('output-area').innerHTML = `
      <div class="loading">
        <div class="loading-quill">✦</div>
        <p>Writing in progress…</p>
      </div>`;
  }

  function showError(msg) {
    document.getElementById('output-area').innerHTML = `<div class="error-msg">⚠ ${msg}</div>`;
  }

  function showResult(text) {
    document.getElementById('output-area').innerHTML = `
      <div class="output-card">
        <div class="output-header">
          <span class="output-label">${modeLabels[currentMode]}</span>
          <div class="output-actions">
            <button class="action-btn" onclick="copyResult()">Copy</button>
            <button class="action-btn" onclick="useAsInput()">Use as input ↺</button>
          </div>
        </div>
        <div class="output-text" id="result-text">${escapeHtml(text)}</div>
      </div>`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function runAssistant() {
    const text = document.getElementById('input-text').value.trim();
    if (!text) { showError('Please enter some text first.'); return; }

    const btn = document.getElementById('run-btn');
    btn.disabled = true;
    showLoading();

    try {
      const response = await fetch('/api/rewrite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, mode: currentMode }),
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'API error');
      showResult(data.result);
    } catch (err) {
      showError(err.message || 'Something went wrong. Please try again.');
    } finally {
      btn.disabled = false;
    }
  }

  function copyResult() {
    const text = document.getElementById('result-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = event.target;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 1800);
    });
  }

  function useAsInput() {
    const text = document.getElementById('result-text').textContent;
    document.getElementById('input-text').value = text;
    document.getElementById('char-count').textContent = text.length + ' characters';
    document.getElementById('output-area').innerHTML = '';
  }
</script>
</body>
</html>
